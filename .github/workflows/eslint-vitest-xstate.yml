name: ESLint, Vitest, and XState Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  initialize-comments:
    name: Initialize PR Review Comments
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Initialize Ordered PR Review Comments
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          retries: 3
          script: |
            const reviewComments = [
              {
                header: '### 🧹 ESLint',
                body: '### 🧹 ESLint\n\n**Quality check 1 of 3**\n\n⏳ Waiting for ESLint.',
              },
              {
                header: '### 🧪 Vitest',
                body: '### 🧪 Vitest\n\n**Quality check 2 of 3**\n\n⏳ Waiting for Vitest.',
              },
              {
                header: '### 🎭 Playwright',
                body: '### 🎭 Playwright\n\n**Quality check 3 of 3**\n\n⏳ Waiting for a successful preview deployment.',
              },
              {
                header: '### 🗺️ XState v5 State Machine Diff Visualization',
                body: '<!-- xstate-v5-change-map -->\n### 🗺️ XState v5 State Machine Diff Visualization\n\n**Architecture visualization**\n\n⏳ Waiting for static XState analysis.',
              },
            ];

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            for (const reviewComment of reviewComments) {
              const existingComment = comments.find(
                comment => comment.user.type === 'Bot' && comment.body?.includes(reviewComment.header),
              );

              if (!existingComment) {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: reviewComment.body,
                });
              }
            }

  lint:
    name: Lint & Annotate PR
    needs: initialize-comments
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install Dependencies
        id: dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint and Capture Output
        id: lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          set +e
          pnpm lint 2>&1 | tee "$RUNNER_TEMP/lint-output.txt"
          LINT_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ "$LINT_EXIT_CODE" -eq 0 ] || grep -Eq '[0-9]+ problems? \([0-9]+ errors?, [0-9]+ warnings?\)' "$RUNNER_TEMP/lint-output.txt"; then
            LINT_RUNNER_STATUS=complete
          else
            LINT_RUNNER_STATUS=failed
          fi

          echo "LINT_EXIT_CODE=$LINT_EXIT_CODE" >> "$GITHUB_ENV"
          echo "LINT_RUNNER_STATUS=$LINT_RUNNER_STATUS" >> "$GITHUB_ENV"
          echo "LINT_OUTPUT_FILE=$RUNNER_TEMP/lint-output.txt" >> "$GITHUB_ENV"

      - name: Post Lint PR Comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          retries: 3
          script: |
            const fs = require('fs');
            const outputPath = process.env.LINT_OUTPUT_FILE;
            const output = outputPath && fs.existsSync(outputPath)
              ? fs.readFileSync(outputPath, 'utf8').trim()
              : '';
            const exitCode = Number.parseInt(process.env.LINT_EXIT_CODE ?? '', 10);
            const runnerStatus = process.env.LINT_RUNNER_STATUS;
            const header = '### 🧹 ESLint';
            const qualityPosition = '**Quality check 1 of 3**';
            const hasFindings = /\d+ problems? \(\d+ errors?, \d+ warnings?\)/.test(output);
            const displayedOutput = output.length > 58000
              ? `…\n${output.slice(-58000)}`
              : output;
            let body;

            if (!Number.isInteger(exitCode) || runnerStatus !== 'complete') {
              body = `${header}\n\n${qualityPosition}\n\n❌ **ESLint could not run.**${displayedOutput ? `\n\n\`\`\`text\n${displayedOutput}\n\`\`\`` : ''}`;
            } else if (exitCode === 0 && !hasFindings) {
              body = `${header}\n\n${qualityPosition}\n\n✅ **Zero warnings.**`;
            } else {
              body = `${header}\n\n${qualityPosition}\n\n⚠️ **ESLint completed with advisory findings.**\n\n\`\`\`text\n${displayedOutput}\n\`\`\``;
            }

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const botComment = comments.find(
              comment => comment.user.type === 'Bot' && comment.body?.includes(header),
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      - name: Run Vitest and Capture Summary
        id: vitest
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          set +e
          pnpm vitest run --coverage --passWithNoTests 2>&1 | tee "$RUNNER_TEMP/vitest-output.txt"
          VITEST_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "VITEST_EXIT_CODE=$VITEST_EXIT_CODE" >> "$GITHUB_ENV"
          echo "VITEST_OUTPUT_FILE=$RUNNER_TEMP/vitest-output.txt" >> "$GITHUB_ENV"
          exit "$VITEST_EXIT_CODE"

      - name: Inspect Vitest Evidence
        id: vitest-evidence
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { execFileSync } = require('node:child_process');
            const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            const tracked = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
            const expectedFiles = tracked.filter(file => /\.test\.tsx?$/.test(file));
            const reportPaths = ['test-results/vitest.json', 'coverage/lcov.info', 'coverage/coverage-final.json', 'coverage/index.html'];
            const missingReports = reportPaths.filter(file => !fs.existsSync(file) || fs.statSync(file).size === 0);
            let missingContributors = [...expectedFiles];
            let incompleteContributors = [];
            let validCoverage = false;
            let reportError = '';
            try {
              const results = JSON.parse(fs.readFileSync(reportPaths[0], 'utf8'));
              const contributors = results.testResults.map(result => ({
                file: path.relative(process.cwd(), result.name).split(path.sep).join('/'),
                complete: result.assertionResults.length > 0 && result.assertionResults.every(assertion => ['passed', 'failed'].includes(assertion.status)),
              }));
              missingContributors = expectedFiles.filter(file => !contributors.some(result => result.file === file));
              incompleteContributors = contributors.filter(result => !result.complete).map(result => result.file);
              const lcov = fs.readFileSync(reportPaths[1], 'utf8');
              const records = lcov.split('end_of_record').map(record => record.trim()).filter(Boolean);
              validCoverage = records.length > 0 && /^DA:\d+,\d+/m.test(lcov) && lcov.trimEnd().endsWith('end_of_record') && records.every(record => {
                const source = record.match(/^SF:(.+)$/m)?.[1].trim().replaceAll('\\', '/');
                if (!source || !tracked.includes(source)) return false;
                const lines = [...record.matchAll(/^DA:(\d+),(\d+)/gm)];
                if (lines.length === 0) return /^LF:0\r?$/m.test(record);
                const lineCount = fs.readFileSync(source, 'utf8').split(/\r?\n/).length;
                return lines.every(([, line]) => Number(line) > 0 && Number(line) <= lineCount);
              });
              JSON.parse(fs.readFileSync(reportPaths[2], 'utf8'));
            } catch {
              reportError = 'A runner or coverage report is missing, unreadable, or invalid.';
            }
            const complete = /^\d+$/.test(process.env.VITEST_EXIT_CODE ?? '') && expectedFiles.length > 0 && missingReports.length === 0 && missingContributors.length === 0 && incompleteContributors.length === 0 && validCoverage && !reportError;
            const evidence = {
              commit, runnerExitCode: process.env.VITEST_EXIT_CODE ?? 'unavailable',
              scope: 'Single root package; imported-source V8 coverage; no shards; Codecov flag vitest.',
              status: complete ? 'complete' : 'unavailable-or-partial',
              missingReports, missingContributors, incompleteContributors, validCoverage, reportError,
            };
            fs.mkdirSync('test-results', { recursive: true });
            const manifest = path.join('test-results', 'vitest-evidence.json');
            fs.writeFileSync(manifest, JSON.stringify(evidence, null, 2));
            core.setOutput('complete', String(complete));
            core.setOutput('manifest', manifest);
            core.exportVariable('VITEST_EVIDENCE_STATUS', evidence.status);
            if (!complete) core.warning('Vitest evidence is unavailable or partial; retain artifacts, but do not publish a comparable Codecov measurement.');
            await core.summary.addHeading('Vitest evidence').addCodeBlock(JSON.stringify(evidence, null, 2), 'json').write();

      - name: Upload Vitest Evidence
        if: ${{ !cancelled() && steps.vitest.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-evidence
          path: |
            coverage/
            test-results/vitest.json
            ${{ steps.vitest-evidence.outputs.manifest }}
          if-no-files-found: error
          retention-days: 14

      - name: Post Vitest PR Comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          retries: 3
          script: |
            const fs = require('fs');
            const outputPath = process.env.VITEST_OUTPUT_FILE;
            const output = outputPath && fs.existsSync(outputPath)
              ? fs.readFileSync(outputPath, 'utf8')
              : '';
            const cleanOutput = output.replace(/\u001b\[[0-9;]*m/g, '');
            const exitCode = Number.parseInt(process.env.VITEST_EXIT_CODE ?? '', 10);
            const header = '### 🧪 Vitest';
            const qualityPosition = '**Quality check 2 of 3**';
            const summaryLines = cleanOutput
              .split(/\r?\n/)
              .filter(line => /Test Files|Tests|Duration|No test files found/.test(line))
              .slice(-8);
            const fallbackLines = cleanOutput
              .split(/\r?\n/)
              .filter(Boolean)
              .slice(-12);
            const summary = (summaryLines.length > 0 ? summaryLines : fallbackLines).join('\n');
            const status = Number.isInteger(exitCode) && exitCode === 0
              ? '✅ **Vitest completed successfully.**'
              : '❌ **Vitest tests failed or the runner could not complete.**';
            const evidenceStatus = process.env.VITEST_EVIDENCE_STATUS ?? 'unavailable';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = `${header}\n\n${qualityPosition}\n\n${status}\n\nCoverage evidence: **${evidenceStatus}**. [Report inventory and artifacts](${runUrl}). Missing evidence is not zero coverage.${summary ? `\n\n\`\`\`text\n${summary}\n\`\`\`` : ''}`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const botComment = comments.find(
              comment => comment.user.type === 'Bot' && comment.body?.includes(header),
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && steps.vitest-evidence.outputs.complete == 'true' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: vitest

      - name: Enforce Test and Tooling Results
        if: ${{ !cancelled() }}
        run: |
          FAILED=0

          if ! [[ "$LINT_EXIT_CODE" =~ ^[0-9]+$ ]] || [ "$LINT_RUNNER_STATUS" != "complete" ]; then
            echo "ESLint could not run."
            FAILED=1
          fi

          if ! [[ "$VITEST_EXIT_CODE" =~ ^[0-9]+$ ]] || [ "$VITEST_EXIT_CODE" -ne 0 ]; then
            echo "Vitest tests failed or the runner could not complete."
            FAILED=1
          fi

          exit "$FAILED"

  xstate-analysis:
    name: Analyze XState v5 Topology
    needs: initialize-comments
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Pull Request History
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install Analysis Dependencies Without Lifecycle Scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Static XState v5 Diff
        id: xstate-analysis
        continue-on-error: true
        run: pnpm xstate:diff
        env:
          XSTATE_DIFF_ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          XSTATE_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          XSTATE_DIFF_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          XSTATE_DIFF_OUTPUT_DIRECTORY: xstate-diff-artifacts

      - name: Upload XState Diff Artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xstate-v5-state-machine-diff
          path: xstate-diff-artifacts/
          if-no-files-found: warn
          retention-days: 14

  xstate-publish:
    name: Publish XState v5 Diff Visualization
    needs:
      - initialize-comments
      - xstate-analysis
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download XState Diff Artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xstate-v5-state-machine-diff
          path: xstate-diff-artifacts

      - name: Publish Stable XState Diff Comment
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          retries: 3
          script: |
            const fs = require('fs');
            const marker = '<!-- xstate-v5-change-map -->';
            const header = '### 🗺️ XState v5 State Machine Diff Visualization';
            const commentPath = 'xstate-diff-artifacts/comment.md';
            const maximumCommentBytes = 60_000;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const fallbackBody = `${marker}\n${header}\n\n**Architecture visualization**\n\n⚠️ **Static XState analysis is unavailable.**\n\n[Inspect workflow run](${runUrl})`;
            let body = fallbackBody;

            if (fs.existsSync(commentPath)) {
              const candidateBody = fs.readFileSync(commentPath, 'utf8').trim();
              const isValid =
                Buffer.byteLength(candidateBody, 'utf8') <= maximumCommentBytes &&
                candidateBody.startsWith(marker) &&
                candidateBody.includes(header);

              if (isValid) {
                body = candidateBody;
              } else {
                core.warning('Rejected an invalid or oversized XState diff comment artifact.');
              }
            }

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const botComment = comments.find(
              comment => comment.user.type === 'Bot' && comment.body?.includes(marker),
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
