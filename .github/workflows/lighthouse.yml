name: Mobile Web Lighthouse Measurements

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mobile-web-lighthouse-production
  cancel-in-progress: true

jobs:
  measure:
    name: Measure Mobile Web Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Wait for Matching Vercel Production Deployment
        if: github.event_name == 'push'
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          retries: 3
          script: |
            const productionEnvironment = "Production";
            const vercelDeploymentCreator = "vercel[bot]";
            const maximumPollingAttempts = 31;
            const pollingIntervalMilliseconds = 30_000;
            const waitForNextPollingAttempt = () =>
              new Promise(resolve =>
                setTimeout(resolve, pollingIntervalMilliseconds),
              );

            for (
              let pollingAttempt = 1;
              pollingAttempt <= maximumPollingAttempts;
              pollingAttempt += 1
            ) {
              const { data: deployments } =
                await github.rest.repos.listDeployments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha: context.sha,
                  environment: productionEnvironment,
                  per_page: 10,
                });
              const matchingDeployment = deployments.find(
                deployment =>
                  deployment.creator?.login === vercelDeploymentCreator,
              );

              if (matchingDeployment) {
                const { data: statuses } =
                  await github.rest.repos.listDeploymentStatuses({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    deployment_id: matchingDeployment.id,
                    per_page: 1,
                  });
                const latestStatus = statuses[0];

                if (latestStatus?.state === "success") {
                  core.info(
                    `Vercel Production deployment ${matchingDeployment.id} is ready.`,
                  );
                  return;
                }

                if (
                  latestStatus?.state === "failure" ||
                  latestStatus?.state === "error"
                ) {
                  throw new Error(
                    `Vercel Production deployment ${matchingDeployment.id} finished with ${latestStatus.state}.`,
                  );
                }
              }

              if (pollingAttempt < maximumPollingAttempts) {
                core.info(
                  `Waiting for Vercel Production deployment ${context.sha} (${pollingAttempt}/${maximumPollingAttempts}).`,
                );
                await waitForNextPollingAttempt();
              }
            }

            throw new Error(
              `Vercel Production deployment ${context.sha} did not succeed within 15 minutes.`,
            );

      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Mobile Web Lighthouse Measurements
        run: pnpm lighthouse

      - name: Prepare Representative Lighthouse Report
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const resultsDirectory = path.resolve("lighthouse-results");
            const pagesDirectory = path.resolve("lighthouse-pages");
            const manifest = JSON.parse(
              fs.readFileSync(path.join(resultsDirectory, "manifest.json"), "utf8"),
            );
            const representativeRun = manifest.find(
              run => run.isRepresentativeRun,
            );

            if (!representativeRun) {
              throw new Error("Lighthouse did not select a representative run.");
            }

            const lighthouseResult = JSON.parse(
              fs.readFileSync(representativeRun.jsonPath, "utf8"),
            );
            const categoryIds = {
              performance: "performance",
              accessibility: "accessibility",
              bestPractices: "best-practices",
              seo: "seo",
            };
            const scores = Object.fromEntries(
              Object.entries(categoryIds).map(([scoreName, categoryId]) => {
                const score = lighthouseResult.categories[categoryId]?.score;

                if (typeof score !== "number") {
                  throw new Error(
                    `Lighthouse did not return a numeric ${categoryId} score.`,
                  );
                }

                return [scoreName, Math.round(score * 100)];
              }),
            );

            fs.mkdirSync(pagesDirectory, { recursive: true });
            fs.copyFileSync(
              representativeRun.htmlPath,
              path.join(pagesDirectory, "index.html"),
            );
            fs.writeFileSync(
              path.join(pagesDirectory, "lighthouse-results.json"),
              `${JSON.stringify(scores, null, 2)}\n`,
            );

      - name: Upload Complete Lighthouse Reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-web-lighthouse-reports
          path: lighthouse-results/
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: lighthouse-pages/

  deploy:
    name: Publish Mobile Web Lighthouse
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-first.outputs.page_url || steps.deploy-second.outputs.page_url || steps.deploy-final.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy GitHub Pages
        id: deploy-first
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Wait Before Second Deployment Attempt
        if: steps.deploy-first.outcome == 'failure'
        run: sleep 30

      - name: Retry GitHub Pages Deployment
        id: deploy-second
        if: steps.deploy-first.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Wait Before Final Deployment Attempt
        if: steps.deploy-first.outcome == 'failure' && steps.deploy-second.outcome == 'failure'
        run: sleep 90

      - name: Final GitHub Pages Deployment Attempt
        id: deploy-final
        if: steps.deploy-first.outcome == 'failure' && steps.deploy-second.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
