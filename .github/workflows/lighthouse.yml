name: Mobile Web Lighthouse Measurements

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mobile-web-lighthouse-production
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Measure and Publish Mobile Web Lighthouse
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Mobile Web Lighthouse Measurements
        run: pnpm lighthouse

      - name: Prepare Representative Lighthouse Report
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const resultsDirectory = path.resolve("lighthouse-results");
            const pagesDirectory = path.resolve("lighthouse-pages");
            const manifest = JSON.parse(
              fs.readFileSync(path.join(resultsDirectory, "manifest.json"), "utf8"),
            );
            const representativeRun = manifest.find(
              run => run.isRepresentativeRun,
            );

            if (!representativeRun) {
              throw new Error("Lighthouse did not select a representative run.");
            }

            const lighthouseResult = JSON.parse(
              fs.readFileSync(representativeRun.jsonPath, "utf8"),
            );
            const categoryIds = {
              performance: "performance",
              accessibility: "accessibility",
              bestPractices: "best-practices",
              seo: "seo",
            };
            const scores = Object.fromEntries(
              Object.entries(categoryIds).map(([scoreName, categoryId]) => {
                const score = lighthouseResult.categories[categoryId]?.score;

                if (typeof score !== "number") {
                  throw new Error(
                    `Lighthouse did not return a numeric ${categoryId} score.`,
                  );
                }

                return [scoreName, Math.round(score * 100)];
              }),
            );

            fs.mkdirSync(pagesDirectory, { recursive: true });
            fs.copyFileSync(
              representativeRun.htmlPath,
              path.join(pagesDirectory, "index.html"),
            );
            fs.writeFileSync(
              path.join(pagesDirectory, "lighthouse-results.json"),
              `${JSON.stringify(scores, null, 2)}\n`,
            );

      - name: Upload Complete Lighthouse Reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-web-lighthouse-reports
          path: lighthouse-results/
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: lighthouse-pages/

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
